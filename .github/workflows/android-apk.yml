name: Android APK scaffold

on:
  workflow_dispatch:
  push:
    branches:
      - android/full-apk-experiment
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Run Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: gradle --no-daemon -p android connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: omniroute-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
